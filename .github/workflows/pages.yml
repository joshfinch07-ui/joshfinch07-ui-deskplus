name: Deploy Desk+ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if gh api "repos/${GITHUB_REPOSITORY}/pages"; then
            echo "Pages site already exists"
            exit 0
          fi
          echo "Creating Pages site with GitHub Actions source"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow
          status=$?
          if [ $status -ne 0 ]; then
            echo "Workflow-source create failed; trying branch source then switching"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f source[branch]=main \
              -f source[path]='/'
            status=$?
          fi
          if [ $status -ne 0 ]; then
            echo "Could not create Pages site with GITHUB_TOKEN"
            exit 1
          fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=workflow || true
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
